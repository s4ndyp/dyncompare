# Dockhand / productie: alleen images van GHCR (geen build-context nodig).
# Gebruik dit bij "Stack plakken" in Dockhand, of zet compose_path op dit bestand bij Git-deploy.
#
# Images: ghcr.io/s4ndyp/dyncompare:latest en .../sync:latest (CI op main).
# Als pull faalt: maak het GHCR-package publiek of voeg registry-credentials toe in Dockhand.

services:
  app:
    image: ghcr.io/s4ndyp/dyncompare:latest
    container_name: dyncompare
    restart: unless-stopped
    ports:
      - "8097:8090"
    volumes:
      - dyncompare_data:/app/pb_data

  sync:
    image: ghcr.io/s4ndyp/dyncompare/sync:latest
    container_name: dyncompare-sync
    restart: unless-stopped
    ports:
      - "8098:8091"
    environment:
      POCKETBASE_URL: http://app:8090
      TZ: Europe/Amsterdam
    depends_on:
      - app

volumes:
  dyncompare_data:
